<head>

<style>
:root{--navy:#1e3a5f;--blue:#2563eb;--blue-d:#1d4ed8;--sky:#e0f0ff;--bg:#f2f7fc;--card:#fff;--line:#c9d9ec;--text:#1b2a41;--muted:#60758f;--warn:#dc2626;--warn-bg:#fee2e2;--ok:#0f766e;--ok-bg:#ccfbf1}

body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}

.nav{display:flex;align-items:center;gap:8px}

button:hover{background:#f5f9ff}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}

.bar{background:#e6eef8;border-radius:4px;height:10px;min-width:120px}

th,td{border-bottom:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btns{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<body>
<header>
  <h1>전공의 당직표 시뮬레이터</h1>
  <div class="nav noprint" id="monthNav"></div>
</header>
<div id="app"></div>

<script>
const DAYS=['일','월','화','수','목','금','토'];
/* 근무시간 기본값 (분 단위). 시작~종료 시각과 휴게시간으로 실근무를 계산합니다. */
const DEFAULT_WORK={
  regular:{start:'07:00',end:'18:00',breakMin:60},
  weekday:{start:'18:00',end:'07:00',breakMin:60},
  weekendDay:{start:'08:00',end:'17:00',breakMin:60},
  weekendNight:{start:'17:00',end:'08:00',breakMin:120},
  weekendAll:{start:'08:00',end:'08:00',breakMin:120}
};
const state={
  residents:[
    {id:1,name:'전공의 A',pgy:1},
    {id:2,name:'전공의 B',pgy:2},
    {id:3,name:'전공의 C',pgy:3},
    {id:4,name:'전공의 D',pgy:4}
  ],
  nextId:5,
  y:2026,m:9,            // 2026년 10월 (month index 9)
  holidays:new Set(),    // 'YYYY-MM-DD' 형식 공휴일
  settings:{maxWeekly:80,noConsec:true,minRest:10,maxCont:24},
  work:JSON.parse(JSON.stringify(DEFAULT_WORK)),
  assign:{},             // { 'YYYY-MM-DD': residentId | null }
  scenarios:[],
  tab:'calendar',
  editId:null,
  dayKind:{},
  upload:null,
  dutyMsg:null,
  dashId:null,
  departments:['Primary','HBP/Breast','Stomach','Pediatric']
};

/* ---------- 날짜 유틸 ---------- */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const fmtMD=d=>`${d.getMonth()+1}/${d.getDate()}`;
const fmtFull=d=>`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 4주 평균 기간: 매월 첫째 주 월요일부터 28일 */
function monthRange(){
  const first=new Date(state.y,state.m,1);
  const last=new Date(state.y,state.m+1,0);
  let fm=first;
  while(fm.getDay()!==1) fm=addD(fm,1);
  const blockEnd=addD(fm,27);
  // 표시 범위: 4주 기간 앞뒤로 1주씩 포함 (예: 10월 → 9/28(월) ~ 11/8(일))
  const viewStart=addD(fm,-7);
  const viewEnd=addD(blockEnd,7);
  return {first,last,blockStart:fm,blockEnd,viewStart,viewEnd,end:viewEnd};
}

/* 주말·공휴일 여부 */
function isWHD(d){return d.getDay()===0||d.getDay()===6||state.holidays.has(dkey(d));}
/* 당직 근무시간: 평일 야간 13h(18:00~익일 07:00), 주말·공휴 24h */
/* 시작~종료 시각으로 총 시간(분)을 구하고, 종료가 시작보다 이르면 익일로 계산한 뒤 휴게시간을 뺀다 */
function calcShift(s){
  const [sh,sm]=s.start.split(':').map(Number);
  const [eh,em]=s.end.split(':').map(Number);
  let gross=(eh*60+em)-(sh*60+sm);
  if(gross<=0) gross+=1440;
  const net=Math.max(0,gross-s.breakMin);
  return {gross,breakMin:s.breakMin,net};
}
/* 주말·공휴일은 날짜별로 낮당직/밤당직 중 하나를 고르며, 기본값은 밤당직 */
function dutyKindOf(d){return state.dayKind[dkey(d)]||'night';}
function dutyShift(d){
  if(!isWHD(d)) return calcShift(state.work.weekday);
  return calcShift(dutyKindOf(d)==='day'?state.work.weekendDay:state.work.weekendNight);
}
function dutyHours(d){return dutyShift(d).net/60;}
function dutyType(d){
  if(!isWHD(d)) return '평일 당직';
  return dutyKindOf(d)==='day'?'주말·공휴 낮당직':'주말·공휴 밤당직';
}
function fmtMin(m){
  const h=Math.floor(m/60), r=m%60;
  return `${h}시간${r?' '+r+'분':''}`;
}

/* ---------- 자동 배정 ---------- */
function autoAssignLegacy(){
  const R=monthRange();
  const hrs={},cnt={},whd={};
  state.residents.forEach(r=>{hrs[r.id]=0;cnt[r.id]=0;whd[r.id]=0;});
  for(let d=new Date(R.viewStart);d<=R.end;d=addD(d,1)){
    const pd=addD(d,-1);
    const w=isWHD(d);
    state.assign[slotKey(d,1)]=null;
    state.assign[slotKey(d,2)]=null;
    slotsOf(d).forEach(n=>{
      let cands=state.residents.filter(r=>
        !onDutyOn(r.id,d) &&
        !did24(r.id,pd) &&
        !(state.settings.noConsec && onDutyOn(r.id,pd)));
      cands=cands.sort(()=>Math.random()-0.5);
      cands.sort((a,b)=>((a.dept===l.dept?0:1)-(b.dept===l.dept?0:1))||(w
        ?(whd[a.id]-whd[b.id]||hrs[a.id]-hrs[b.id])
        :(hrs[a.id]-hrs[b.id]||cnt[a.id]-cnt[b.id])));
      const pick=cands[0];
      if(pick){
        state.assign[slotKey(d,n)]=pick.id;
        hrs[pick.id]+=slotShift(d,n).net/60;
        if(w) whd[pick.id]++; else cnt[pick.id]++;
      }
    });
  }
}

function autoAssignOld(){
  const R=monthRange();
  const hrs={},cnt={},whd={};
  state.residents.forEach(r=>{hrs[r.id]=0;cnt[r.id]=0;whd[r.id]=0;});
  for(let d=new Date(R.viewStart);d<=R.end;d=addD(d,1)){
    const k=dkey(d), p=dkey(addD(d,-1));
    const w=isWHD(d);
    let cands=state.residents.filter(r=>!(state.settings.noConsec && state.assign[p]===r.id));
    cands=cands.sort(()=>Math.random()-0.5); // 동점일 때 다양한 배정안이 나오도록 무작위 순서
    cands.sort((a,b)=>w
      ?(whd[a.id]-whd[b.id]||hrs[a.id]-hrs[b.id])
      :(hrs[a.id]-hrs[b.id]||cnt[a.id]-cnt[b.id]));
    const pick=cands[0];
    if(pick){
      state.assign[k]=pick.id;
      hrs[pick.id]+=dutyHours(d);
      if(w) whd[pick.id]++; else cnt[pick.id]++;
    } else {
      state.assign[k]=null;
    }
  }
}

/* ---------- 통계 ---------- */
/* ---- 주말·공휴일은 1번 칸(키=날짜)과 2번 칸(키=날짜#2) 두 명 배정, 평일은 1번 칸만 사용 ---- */
/* ---- 분과별 1명 라인: 평일은 분과당 1칸, 주말·공휴일은 분과당 낮칸·밤칸 (낮칸에서 통당직 선택 가능) ---- */
function lineDefs(d){
  const depts=state.departments.length?state.departments:[''];
  if(!isWHD(d)) return depts.map(dp=>({id:dp,dept:dp,kind:'weekday'}));
  return depts.flatMap(dp=>[{id:dp+'|day',dept:dp,kind:'day'},{id:dp+'|night',dept:dp,kind:'night'}]);
}
function slotsOf(d){return lineDefs(d).map(l=>l.id);}
function slotKey(d,n){return dkey(d)+'#'+n;}
function lineOf(d,n){return lineDefs(d).find(l=>l.id===n);}
function slotKind(d,n){
  const ln=lineOf(d,n);
  if(!ln||ln.kind==='weekday') return 'weekday';
  if(ln.kind==='night') return 'night';
  return state.dayKind[slotKey(d,n)]==='all'?'all':'day';
}
function slotCfg(d,n){
  const k=slotKind(d,n);
  if(k==='weekday') return state.work.weekday;
  if(k==='all') return state.work.weekendAll;
  if(k==='night') return state.work.weekendNight;
  return state.work.weekendDay;
}
function slotShift(d,n){return calcShift(slotCfg(d,n));}
function slotType(d,n){
  const k=slotKind(d,n);
  return k==='weekday'?'평일 당직':k==='all'?'주말·공휴 통당직':k==='day'?'주말·공휴 낮당직':'주말·공휴 밤당직';
}

/* 같은 분과의 낮칸·밤칸을 같은 사람이 맡았거나 통당직이면 24시간 근무 */
function did24(rid,d){
  return lineDefs(d).some(l=>{
    if(l.kind!=='day') return false;
    const k=slotKey(d,l.id);
    if(state.assign[k]!==rid) return false;
    if(state.dayKind[k]==='all') return true;
    return state.assign[slotKey(d,l.dept+'|night')]===rid;
  });
}

function autoAssign(){
  const R=monthRange();
  const hrs={},cnt={},whd={};
  state.residents.forEach(r=>{hrs[r.id]=0;cnt[r.id]=0;whd[r.id]=0;});
  for(let d=new Date(R.viewStart);d<=R.end;d=addD(d,1)){
    const pd=addD(d,-1);
    const w=isWHD(d);
    const L=lineDefs(d);
    L.forEach(l=>{
      state.assign[slotKey(d,l.id)]=null;
      if(l.kind==='day') delete state.dayKind[slotKey(d,l.id)];
    });
    L.forEach(l=>{
      let cands=state.residents.filter(r=>
        !onDutyOn(r.id,d) &&
        !did24(r.id,pd) &&
        !(state.settings.noConsec && onDutyOn(r.id,pd)));
      cands=cands.sort(()=>Math.random()-0.5);
      cands.sort((a,b)=>w
        ?(whd[a.id]-whd[b.id]||hrs[a.id]-hrs[b.id])
        :(hrs[a.id]-hrs[b.id]||cnt[a.id]-cnt[b.id]));
      const pick=cands[0];
      if(pick){
        state.assign[slotKey(d,l.id)]=pick.id;
        hrs[pick.id]+=slotShift(d,l.id).net/60;
        if(w) whd[pick.id]++; else cnt[pick.id]++;
      }
    });
  }
}

/* 업로드: 이름으로 분과를 찾아 해당 분과 라인에 배정 (구분: 낮/밤/통) */
function applyDutyRows(ok){
  const dates=new Set(ok.map(x=>x.dk));
  dates.forEach(dk=>{
    Object.keys(state.assign).forEach(k=>{ if(k.startsWith(dk+'#')) state.assign[k]=null; });
    Object.keys(state.dayKind).forEach(k=>{ if(k.startsWith(dk+'#')) delete state.dayKind[k]; });
  });
  let count=0;
  ok.forEach(x=>{
    const [y,m,dd]=x.dk.split('-').map(Number);
    const d=new Date(y,m-1,dd);
    const whd=isWHD(d);
    const dept=x.lineDept||x.res.dept||'';
    const mine=lineDefs(d).filter(l=>l.dept===dept);
    if(!mine.length) return;
    let line;
    if(!whd) line=mine[0];
    else if(x.kind==='all'||x.kind==='day') line=mine.find(l=>l.kind==='day');
    else if(x.kind==='night') line=mine.find(l=>l.kind==='night');
    else line=mine.find(l=>!state.assign[slotKey(d,l.id)]) || mine[0];
    if(!line) return;
    if(state.assign[slotKey(d,line.id)]){
      const free=mine.find(l=>!state.assign[slotKey(d,l.id)]);
      if(free) line=free;
    }
    const key=slotKey(d,line.id);
    state.assign[key]=x.res.id;
    if(whd && x.kind==='all'){
      state.dayKind[key]='all';
      state.assign[slotKey(d,dept+'|night')]=null;
    }
    count++;
  });
  return count;
}

/* 당직표: 맨 왼쪽 열에 분과명, 그 옆으로 일~토 날짜 열. 분과마다 "낮/평일당직"과 "밤" 두 줄 */
function viewCalendar(){
  const R=monthRange();
  const {set}=conflictInfo();
  const RI=restInfo();
  const depts=state.departments.length?state.departments:[''];
  const startGrid=addD(R.viewStart,-R.viewStart.getDay());
  const endGrid=addD(R.viewEnd,6-R.viewEnd.getDay());
  const inView=d=>d>=R.viewStart && d<=R.viewEnd;
  const personSel=(sk,dp,id,blocked)=>{
    const opts=[...state.residents].sort((a,b)=>((a.dept===dp)?0:1)-((b.dept===dp)?0:1));
    return `<select data-k="${sk}" ${blocked?'disabled':''}><option value="">-- 미배정 --</option>`+
      opts.map(r=>`<option value="${r.id}" ${r.id===id?'selected':''}>${esc(r.name)} (${r.pgy}년차${r.dept&&r.dept!==dp?' · '+esc(r.dept)+' 소속':''})</option>`).join('')+
      `</select>`;
  };
  const cellDay=(d,dp,row)=>{
    if(!inView(d)) return '<td class="blank"></td>';
    const k=dkey(d);
    const whd=isWHD(d);
    const cls=['cellT'];
    if(d>=R.blockStart && d<=R.blockEnd) cls.push('block'); else cls.push('edge');
    if(set.has(k)) cls.push('warn');
    if(whd) cls.push('whd');
    if(!whd && row==='night') return `<td class="${cls.join(' ')} na">-</td>`;
    const lid=whd?(dp+'|'+row):dp;
    const sk=slotKey(d,lid);
    const id=state.assign[sk];
    const blocked=whd && row==='night' && state.dayKind[slotKey(d,dp+'|day')]==='all';
    let html='';
    if(whd && row==='day'){
      const kind=state.dayKind[sk]==='all'?'all':'day';

/* ---- 수련 시간 검사: 정규근무와 당직을 시간순으로 이어서 최대연속수련·수련간 휴게 계산 ---- */
function workIntervals(id){
  const R=monthRange();
  const toMs=(d,hm)=>{const [h,m]=hm.split(':').map(Number); return new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m).getTime();};
  const out=[];
  for(let d=addD(R.viewStart,-1); d<=addD(R.viewEnd,1); d=addD(d,1)){
    const x=dayWorkFor(id,d);
    if(x.reg>0){
      const c=state.work.regular, cs=calcShift(c), s=toMs(d,c.start);
      out.push({s,e:s+cs.gross*60000,dk:dkey(d),kind:'정규'});
    }
    slotsOf(d).forEach(n=>{
      if(state.assign[slotKey(d,n)]!==id) return;
      const cfg=slotCfg(d,n), cs=calcShift(cfg), s=toMs(d,cfg.start);
      out.push({s,e:s+cs.gross*60000,dk:dkey(d),kind:slotType(d,n)});
    });
  }
  return out.sort((a,b)=>a.s-b.s);
}

/* 연속수련: 구간 사이 휴게가 최소 휴게 시간 미만이면 같은 연속수련으로 묶음.
   연속수련이 최대 시간을 넘으면 위반(연속수련 끝나는 날짜), 휴게가 0보다 크고 최소 휴게 미만이면 수련간 휴게 위반(다음 근무 날짜) */
function restInfo(){
  const R=monthRange();
  const restMs=(state.settings.minRest??10)*3600000;
  const maxMs=(state.settings.maxCont??24)*3600000;
  const from=R.blockStart.getTime(), to=addD(R.blockEnd,1).getTime();
  const cont={}, rest={}, detail={};
  state.residents.forEach(r=>{
    cont[r.id]=0; rest[r.id]=0; detail[r.id]=[];
    const iv=workIntervals(r.id);
    let ch=null;
    const finish=c=>{
      const dur=c.e-c.s;
      if(dur>maxMs && c.s>=from && c.s<to){
        cont[r.id]++;
        detail[r.id].push({dk:c.lastDk,type:'cont',text:`연속수련 ${(dur/3600000).toFixed(1)}h (기준 ${state.settings.maxCont}h 초과)`});
      }
    };
    iv.forEach(x=>{
      if(!ch){ ch={s:x.s,e:x.e,lastDk:x.dk}; return; }
      const gap=x.s-ch.e;
      if(gap>=restMs){ finish(ch); ch={s:x.s,e:x.e,lastDk:x.dk}; return; }
      if(gap>0 && x.s>=from && x.s<to){
        rest[r.id]++;
        detail[r.id].push({dk:x.dk,type:'rest',text:`수련간 휴게 ${(gap/3600000).toFixed(1)}h (기준 ${state.settings.minRest}h 미만)`});
      }
      ch.e=Math.max(ch.e,x.e); ch.lastDk=x.dk;
    });
    if(ch) finish(ch);
  });
  return {cont,rest,detail};
}

function longRunCounts(){
  return restInfo().cont;
}

function longRunCountsDuty(){
  const R=monthRange();
  const MAX_MS=24*60*60000;
  const toMs=(d,hm)=>{const [h,m]=hm.split(':').map(Number); return new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m).getTime();};
  const ivs={};
  state.residents.forEach(r=>ivs[r.id]=[]);
  for(let d=new Date(R.viewStart); d<=R.viewEnd; d=addD(d,1)){
    slotsOf(d).forEach(n=>{
      const id=state.assign[slotKey(d,n)];
      if(!id||!ivs[id]) return;
      const cfg=slotCfg(d,n);
      const c=calcShift(cfg);
      const s=toMs(d,cfg.start);
      ivs[id].push({s,e:s+c.gross*60000});
    });
  }
  const from=R.blockStart.getTime(), to=addD(R.blockEnd,1).getTime();
  const out={};
  Object.keys(ivs).forEach(id=>{
    const list=ivs[id].sort((a,b)=>a.s-b.s);
    const merged=[];
    list.forEach(x=>{
      const last=merged[merged.length-1];
      if(last && x.s<=last.e) last.e=Math.max(last.e,x.e);
      else merged.push({s:x.s,e:x.e});
    });
    out[id]=merged.filter(m=>m.s>=from && m.s<to && (m.e-m.s)>MAX_MS).length;
  });
  return out;
}

function slotsOfLegacy(d){return isWHD(d)?[1,2]:[1];}
function slotKeyLegacy(d,n){return n===2?dkey(d)+'#2':dkey(d);}
function slotKindLegacy(d,n){return state.dayKind[slotKeyLegacy(d,n)]||(n===2?'night':'day');}
function slotShiftLegacy(d,n){
  if(!isWHD(d)) return calcShift(state.work.weekday);
  return calcShift(slotKind(d,n)==='day'?state.work.weekendDay:state.work.weekendNight);
}
function slotTypeLegacy(d,n){
  if(!isWHD(d)) return '평일 당직';
  return slotKind(d,n)==='day'?'주말·공휴 낮당직':'주말·공휴 밤당직';
}
/* 전공의가 해당 날짜에 어느 칸이든 당직인지 */
/* 전날 당직 때문에 다음 날이 OFF인지 판정: 평일 당직 다음 날은 OFF, 주말 당직 다음 날(평일)은 정규근무 */
/* 같은 주말 날짜에 낮당직과 밤당직을 모두 한 경우(24시간 근무) */
function did24Legacy(rid,d){
  const ns=slotsOf(d);
  return ns.length===2 && ns.every(n=>state.assign[slotKey(d,n)]===rid);
}

function offAfter(rid,pd){
  // 주말 24시간 근무(낮+밤 또는 통당직) 다음 날은 OFF
  if(did24(rid,pd)) return true;
  return onDutyOn(rid,pd) && !isWHD(pd);
}

function onDutyOn(rid,d){
  return slotsOf(d).some(n=>state.assign[slotKey(d,n)]===rid);
}

/* 4주 평균 근무(h/주) = (정규근무 + 당직근무) 4주 합계 ÷ 4 */
function statsFor(assign){
  const out=statsForV28(assign);
  const wb=workBreakdown();
  Object.values(out).forEach(o=>{
    const w=wb[o.id];
    if(!w) return;
    o.wkH=w.total/60/4;
    o.over=o.wkH>state.settings.maxWeekly;
  });
  return out;
}

function statsForV28(assign){
  const out=statsForBase(assign);
  const R=monthRange();
  Object.values(out).forEach(o=>{
    if(o.blockH>0) return;          // 당직이 있는 전공의는 기존 계산 유지
    // 4주 기간에 당직이 아예 없으면 정규근무 시간으로 집계
    let reg=0;
    for(let d=new Date(R.blockStart); d<=R.blockEnd; d=addD(d,1)){
      reg+=dayWorkFor(o.id,d).reg;
    }
    o.regOnly=true;
    o.regH=reg/60;
    o.wkH=reg/60/4;
  });
  return out;
}

function statsForBase(assign){
  const R=monthRange();
  const out={};
  state.residents.forEach(r=>out[r.id]={id:r.id,name:r.name,pgy:r.pgy,monthH:0,blockH:0,night:0,whd:0});
  for(let d=new Date(R.first);d<=R.last;d=addD(d,1)){
    slotsOf(d).forEach(n=>{
      const id=assign[slotKey(d,n)];
      if(id&&out[id]) out[id].monthH+=slotShift(d,n).net/60;
    });
  }
  for(let d=new Date(R.blockStart);d<=R.blockEnd;d=addD(d,1)){
    slotsOf(d).forEach(n=>{
      const id=assign[slotKey(d,n)];
      if(!id||!out[id]) return;
      const o=out[id];
      o.blockH+=slotShift(d,n).net/60;
      if(isWHD(d)) o.whd++; else o.night++;
    });
  }
  Object.values(out).forEach(o=>{
    o.wkH=o.blockH/4;
    o.wkN=o.night/4;
    o.over=o.wkH>state.settings.maxWeekly;
  });
  return out;
}

function statsForOld(assign){
  const R=monthRange();
  const out={};
  state.residents.forEach(r=>out[r.id]={id:r.id,name:r.name,pgy:r.pgy,monthH:0,blockH:0,night:0,whd:0});
  for(let d=new Date(R.first);d<=R.last;d=addD(d,1)){
    const id=assign[dkey(d)];
    if(id&&out[id]) out[id].monthH+=dutyHours(d);
  }
  for(let d=new Date(R.blockStart);d<=R.blockEnd;d=addD(d,1)){
    const id=assign[dkey(d)];
    if(!id||!out[id]) continue;
    const o=out[id];
    o.blockH+=dutyHours(d);
    if(isWHD(d)) o.whd++; else o.night++;
  }
  Object.values(out).forEach(o=>{
    o.wkH=o.blockH/4;
    o.wkN=o.night/4;
    o.over=o.wkH>state.settings.maxWeekly;
  });
  return out;
}

/* 연속 당직 위반 */
function conflictInfo(){
  const R=monthRange();
  const set=new Set(), per={};
  if(!state.settings.noConsec) return {set,per};
  for(let d=new Date(R.viewStart);d<=R.end;d=addD(d,1)){
    const k=dkey(d), p=dkey(addD(d,-1)), pd=addD(d,-1);
    const today=slotsOf(d).map(n=>state.assign[slotKey(d,n)]).filter(Boolean);
    const prevIds=slotsOf(pd).map(n=>state.assign[slotKey(pd,n)]).filter(Boolean);
    today.forEach(id=>{
      if(prevIds.includes(id)){
        set.add(k); set.add(p);
        per[id]=(per[id]||0)+1;
      }
    });
    // 같은 날 낮당직과 밤당직을 같은 사람이 이어서 하는 경우(24시간 근무)는 연속 당직으로 보지 않음
  }
  return {set,per};
}

function conflictInfoOld(){
  const R=monthRange();
  const set=new Set(), per={};
  if(!state.settings.noConsec) return {set,per};
  for(let d=new Date(R.viewStart);d<=R.end;d=addD(d,1)){
    const k=dkey(d), p=dkey(addD(d,-1));
    const id=state.assign[k];
    if(id && state.assign[p]===id){
      set.add(k); set.add(p);
      per[id]=(per[id]||0)+1;
    }
  }
  return {set,per};
}

/* 표시 범위의 주(월~일)별 전공의 당직 시간 */
function weeklyDuty(){
  const R=monthRange();
  const weeks=[];
  for(let ws=new Date(R.viewStart);ws<=R.viewEnd;ws=addD(ws,7)){
    const row={start:ws,end:addD(ws,6),hrs:{}};
    state.residents.forEach(r=>row.hrs[r.id]=0);
    for(let i=0;i<7;i++){
      const d=addD(ws,i);
      const id=state.assign[dkey(d)];
      if(id!=null && row.hrs[id]!==undefined) row.hrs[id]+=dutyHours(d);
    }
    row.edge = ws<R.blockStart || ws>addD(R.blockEnd,-6);
    weeks.push(row);
  }
  return weeks;
}

/* 전공의 한 명의 하루 근무: 당직일=당직, 당직이 없는 평일=정규, 주말 비당직일·당직 다음 날=OFF */
function dayWorkFor(rid,d){
  const w=isWHD(d);
  if(onDutyOn(rid,d)){
    let duty=0, brk=0; const labels=[];
    slotsOf(d).forEach(n=>{
      if(state.assign[slotKey(d,n)]===rid){
        const c=slotShift(d,n);
        duty+=c.net; brk+=c.breakMin; labels.push(slotType(d,n));
      }
    });
    const rc=calcShift(state.work.regular);
    const addReg=!w;
    return {kind:labels.join(' + '),reg:addReg?rc.net:0,duty,brk:brk+(addReg?rc.breakMin:0)};
  }
  if(!w && !offAfter(rid,addD(d,-1))){
    const c=calcShift(state.work.regular);
    return {kind:'정규',reg:c.net,duty:0,brk:c.breakMin};
  }
  return {kind:'OFF',reg:0,duty:0,brk:0};
}

function dayWorkForOld(rid,d){
  const k=dkey(d), p=dkey(addD(d,-1));
  const w=isWHD(d);
  const C={regular:calcShift(state.work.regular)};
  if(state.assign[k]===rid){
    const c=dutyShift(d);
    return {kind:dutyType(d),reg:0,duty:c.net,brk:c.breakMin};
  }
  if(!w && state.assign[p]!==rid){
    return {kind:'정규',reg:C.regular.net,duty:0,brk:C.regular.breakMin};
  }
  return {kind:'OFF',reg:0,duty:0,brk:0};
}

/* 표시 범위의 주(월~일)별 전공의 근무시간 (정규 + 당직) */
function weeklyWork(){
  const R=monthRange();
  const weeks=[];
  for(let ws=new Date(R.viewStart);ws<=R.viewEnd;ws=addD(ws,7)){
    const row={start:ws,end:addD(ws,6),byRes:{},edge:ws<R.blockStart || ws>addD(R.blockEnd,-6)};
    state.residents.forEach(r=>row.byRes[r.id]={reg:0,duty:0});
    for(let i=0;i<7;i++){
      const d=addD(ws,i);
      state.residents.forEach(r=>{
        const x=dayWorkFor(r.id,d);
        row.byRes[r.id].reg+=x.reg;
        row.byRes[r.id].duty+=x.duty;
      });
    }
    weeks.push(row);
  }
  return weeks;
}

/* ---- 당직표 엑셀 업로드: 날짜별 당직자 자동 배정 ---- */
/* 날짜 셀(엑셀 날짜 숫자, 2026-10-05, 2026.10.05, 10/5/2026 등)을 'YYYY-MM-DD'로 변환 */
function excelDateKey(v){
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if(typeof v==='number' && v>20000){
    const dt=new Date(Math.round((v-25569)*86400000));
    return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth()+1)}-${pad(dt.getUTCDate())}`;
  }
  const s=String(v??'').trim();
  let m=s.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
  if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    const y=m[3].length===2?'20'+m[3]:m[3];
    return `${y}-${pad(+m[1])}-${pad(+m[2])}`;
  }
  return null;
}

/* 2차원 배열에서 제목 행을 찾아 당직 행으로 변환. 열: 날짜(필수), 이름 또는 사번(필수), 순번(선택, 1·2), 구분(선택, 낮/밤) */
function parseDutySheet(aoa){
  const norm=s=>String(s??'').replace(/[\s\u00A0\u200B-\u200D\uFEFF]/g,'');
  const hi=aoa.findIndex(row=>row.some(c=>norm(c)==='날짜'));
  if(hi<0) return {ok:[],errors:['"날짜" 열을 찾을 수 없습니다. 첫 행에 제목(날짜, 이름, 순번, 구분)을 넣어 주세요.']};
  const head=aoa[hi].map(norm);
  const col={
    date:head.findIndex(h=>h==='날짜'),
    name:head.findIndex(h=>h.includes('이름')||h==='성명'),
    emp:head.findIndex(h=>h.includes('사번')),
    slot:head.findIndex(h=>h.includes('순번')),
    kind:head.findIndex(h=>h.includes('구분')),
    dept:head.findIndex(h=>h.includes('분과'))
  };
  if(col.name<0 && col.emp<0) return {ok:[],errors:['"이름" 또는 "사번" 열을 찾을 수 없습니다.']};
  const ok=[], errors=[];
  for(let i=hi+1;i<aoa.length;i++){
    const r=aoa[i];
    if(!r || r.every(c=>String(c??'').trim()==='')) continue;
    const get=c=>c>=0?r[c]:'';
    const rowNo=i+1;
    const dk=excelDateKey(get(col.date));
    if(!dk){ errors.push(`${rowNo}행: 날짜 형식 확인`); continue; }
    const emp=String(get(col.emp)??'').trim();
    const nm=String(get(col.name)??'').trim();
    const res=(emp && state.residents.find(x=>x.empNo===emp)) || (nm && state.residents.find(x=>x.name===nm));
    if(!res){ errors.push(`${rowNo}행: 명단에 없는 전공의 (${emp||nm||'빈칸'})`); continue; }
    const givenDept=String(get(col.dept)??'').trim();
    const lineDeptName=givenDept||res.dept||'';
    if(state.departments.length && !state.departments.includes(lineDeptName)){ errors.push(`${rowNo}행: ${res.name} 근무 분과 확인 (${lineDeptName||'미지정'})`); continue; }
    const slotRaw=String(get(col.slot)??'').trim();
    const kindRaw=String(get(col.kind)??'').trim();
    ok.push({
      dk,
      res,
      lineDept:givenDept||res.dept||'',
      slot:slotRaw==='2'?2:(slotRaw==='1'?1:0),
      kind:kindRaw.includes('통')?'all':(kindRaw.includes('낮')?'day':(kindRaw.includes('밤')?'night':''))
    });
  }
  return {ok,errors};
}

/* 업로드된 날짜의 기존 배정을 지운 뒤 새 당직자를 넣음 */
function applyDutyRowsLegacy(ok){
  const dates=new Set(ok.map(x=>x.dk));
  dates.forEach(dk=>{
    state.assign[dk]=null; state.assign[dk+'#2']=null;
    delete state.dayKind[dk]; delete state.dayKind[dk+'#2'];
  });
  let count=0;
  ok.forEach(x=>{
    const [y,m,dd]=x.dk.split('-').map(Number);
    const whd=isWHD(new Date(y,m-1,dd));
    let n;
    if(!whd) n=1;
    else if(x.slot) n=x.slot;
    else if(x.kind==='day') n=1;
    else if(x.kind==='night') n=2;
    else n=state.assign[x.dk]?2:1;
    if(!whd) n=1;                       // 평일은 1번 칸만 사용
    const key=n===2?x.dk+'#2':x.dk;
    state.assign[key]=x.res.id;
    if(whd && x.kind) state.dayKind[key]=x.kind;
    count++;
  });
  return count;
}

function handleDutyUpload(file){
  if(!file) return;
  const isCSV=/\.csv$/i.test(file.name);
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      let res;
      if(isCSV){
        const buf=fr.result;
        let text=new TextDecoder('utf-8').decode(buf);
        if(!text.includes('날짜')) text=new TextDecoder('euc-kr').decode(buf);
        res=parseDutySheet(parseCSV(text));
      } else {
        if(typeof XLSX==='undefined') throw new Error('엑셀 기능을 불러오지 못했습니다. CSV 파일로 올려 주세요.');
        const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});
        const names=(wb&&wb.SheetNames)||[];
        if(!names.length) throw new Error('엑셀 파일에서 시트를 찾지 못했습니다.');
        res=null;
        for(const nm of names){
          const aoa=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:'',raw:true});
          const r=parseDutySheet(aoa);
          if(r.ok.length){res=r;break;}
          if(!res) res=r;
        }
      }
      const n=applyDutyRows(res.ok);
      state.dutyMsg={
        info:n?`${n}건을 당직표에 반영했습니다. 업로드한 날짜의 기존 배정은 덮어썼습니다.`:'반영된 당직이 없습니다.',
        errors:res.errors
      };
    }catch(err){
      console.error('당직 업로드 오류:',err);
      state.dutyMsg={info:'',errors:['업로드 실패: '+err.message]};
    }
    render();
  };
  fr.readAsArrayBuffer(file);
}

}

/* 연속 근무(당직이 이어진 시간, 휴게 포함)가 24시간을 초과한 횟수 (전공의별) */
/* 4주 기간의 1~4주차마다 OFF인 날이 하루도 없으면 위반 (전공의별 위반 주차 목록) */
function offViolations(){
  const R=monthRange();
  const out={};
  state.residents.forEach(r=>{
    const bad=[];
    for(let k=0;k<4;k++){
      const ws=addD(R.blockStart,7*k);
      let hasOff=false;
      for(let i=0;i<7;i++){
        if(dayWorkFor(r.id,addD(ws,i)).kind==='OFF'){hasOff=true;break;}
      }
      if(!hasOff) bad.push(k+1);
    }
    out[r.id]=bad;
  });
  return out;
}

function longRunCountsLegacy(){
  const R=monthRange();
  const MAX_MS=24*60*60000;
  const toMs=(d,hm)=>{const [h,m]=hm.split(':').map(Number); return new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m).getTime();};
  const ivs={};
  state.residents.forEach(r=>ivs[r.id]=[]);
  for(let d=new Date(R.viewStart); d<=R.viewEnd; d=addD(d,1)){
    slotsOf(d).forEach(n=>{
      const id=state.assign[slotKey(d,n)];
      if(!id||!ivs[id]) return;
      const cfg=!isWHD(d)?state.work.weekday:(slotKind(d,n)==='day'?state.work.weekendDay:state.work.weekendNight);
      const c=calcShift(cfg);
      const s=toMs(d,cfg.start);
      ivs[id].push({s,e:s+c.gross*60000});
    });
  }
  const from=R.blockStart.getTime(), to=addD(R.blockEnd,1).getTime();
  const out={};
  Object.keys(ivs).forEach(id=>{
    const list=ivs[id].sort((a,b)=>a.s-b.s);
    const merged=[];
    list.forEach(x=>{
      const last=merged[merged.length-1];
      if(last && x.s<=last.e) last.e=Math.max(last.e,x.e);
      else merged.push({s:x.s,e:x.e});
    });
    out[id]=merged.filter(m=>m.s>=from && m.s<to && (m.e-m.s)>MAX_MS).length;
  });
  return out;
}

/* ---- 세부 분과별 요약 및 CSV ---- */
function deptSummaryRows(){
  const st=statsFor(state.assign);
  const lr=longRunCounts();
  const RIs=restInfo();
  const off=offViolations();
  const groups={};
  state.residents.forEach(r=>{
    const key=r.dept||'미지정';
    if(!groups[key]) groups[key]={name:key,n:0,wk:0,night:0,long:0,offBad:0};
    const g=groups[key], o=st[r.id];
    g.n++;
    g.wk+=o.wkH;
    g.night+=o.wkN;
    g.long+=lr[r.id]||0;
    if(off[r.id].length) g.offBad++;
  });
  const order=[...state.departments,'미지정'];
  const keys=[...order.filter(k=>groups[k]), ...Object.keys(groups).filter(k=>!order.includes(k))];
  return keys.map(k=>{const g=groups[k]; return {...g, avgWk:g.wk/g.n, avgNight:g.night/g.n};});
}

function exportDeptCSV(){

  return sel+cards+vHtml+weekly+daily;

/* CSV 한 줄씩 나누기 (쌍따옴표 안의 쉼표는 무시) */
function parseCSV(text){
  return text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim()!=='').map(line=>{
    const out=[]; let cur='', q=false;
    for(const ch of line){
      if(ch==='"') q=!q;
      else if(ch===','&&!q){out.push(cur);cur='';}
      else cur+=ch;
    }
    out.push(cur);
    return out;
  });
}

/* 2차원 배열(행×열)에서 제목 행을 찾아 명단 행으로 변환 */
function parseRosterSheet(aoa){
  const norm=s=>String(s??'').replace(/[\s\u00A0\u200B-\u200D\uFEFF]/g,'');
  const isNameCell=c=>{const t=norm(c); return t.includes('이름')||t==='성명';};
  const hi=aoa.findIndex(row=>row.some(isNameCell));
  if(hi<0){
    const sample=aoa.filter(r=>r.some(c=>String(c??'').trim()!==''))
      .slice(0,3)
      .map(r=>r.filter(c=>String(c??'').trim()!=='').join(' | '))
      .join(' / ');
    return {rows:[],error:`"이름" 열을 찾을 수 없습니다. 읽은 첫 행 내용: ${sample||'(비어 있음)'}`};
  }
  const head=aoa[hi].map(norm);
  const col={
    seq:head.findIndex(h=>h.includes('순번')),
    emp:head.findIndex(h=>h.includes('사번')),
    name:head.findIndex(h=>h.includes('이름')||h==='성명'),
    pgy:head.findIndex(h=>h.includes('연차')),
    sex:head.findIndex(h=>h.includes('남/여')||h.includes('성별')),
    dept:head.findIndex(h=>h.includes('분과'))
  };
  if(col.pgy<0 && col.name>=0) col.pgy=col.name+1;
  const rows=[];
  for(let i=hi+1;i<aoa.length;i++){
    const r=aoa[i];
    if(!r || r.every(c=>String(c??'').trim()==='')) continue;
    const get=c=>c>=0?String(r[c]??'').trim():'';
    const name=get(col.name);
    const pgy=parseInt(get(col.pgy).replace(/[^0-9]/g,''),10)||0;
    const sexRaw=get(col.sex);
    const sex=sexRaw.startsWith('남')?'남':sexRaw.startsWith('여')?'여':'';
    const problems=[];
    if(!name) problems.push('이름 없음');
    if(!(pgy>=1 && pgy<=4)) problems.push('연차(1~4) 확인');
    if(sexRaw && !sex) problems.push('남/여 확인');
    rows.push({seq:get(col.seq),emp:get(col.emp),name,pgy,sex,dept:get(col.dept),err:problems.join(', ')});
  }
  const seen=new Set();
  rows.forEach(r=>{
    if(!r.emp) return;
    if(seen.has(r.emp)) r.err=(r.err?r.err+', ':'')+'사번 중복';
    seen.add(r.emp);
  });
  return {rows};
}

/* 선택한 파일을 읽어 미리보기 상태로 저장 */
function handleUpload(file){
  if(!file) return;
  const isCSV=/\.csv$/i.test(file.name);
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      let res=null;
      if(isCSV){
        const buf=fr.result;
        let text=new TextDecoder('utf-8').decode(buf);
        // 엑셀에서 "CSV(쉼표로 분리)"로 저장하면 CP949로 저장되므로 다시 읽기
        if(!text.includes('이름')) text=new TextDecoder('euc-kr').decode(buf);
        res=parseRosterSheet(parseCSV(text));
      } else {
        if(typeof XLSX==='undefined') throw new Error('엑셀 기능을 불러오지 못했습니다. CSV 파일로 올려 주세요.');
        const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});
        const names=(wb&&wb.SheetNames)||[];
        if(!names.length) throw new Error('엑셀 파일에서 시트를 찾지 못했습니다. 올바른 엑셀(.xlsx) 파일인지 확인해 주세요.');
        // 모든 시트를 확인해 명단이 있는 첫 시트를 사용
        for(const nm of names){
          const aoa=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:''});
          const r=parseRosterSheet(aoa);
          if(!r.error){res=r;break;}
          if(!res) res=r;
        }
      }
      state.upload={file:file.name,rows:res.rows,error:res.error||''};
    }catch(err){
      console.error('명단 업로드 오류:',err);
      state.upload={file:file.name,rows:[],error:'업로드 실패: '+err.message};
    }
    render();
  };
  fr.readAsArrayBuffer(file);
}

/* 업로드 양식 파일 내려받기 */
function downloadTemplate(){
  const aoa=[
    ['순번','사번','이름','연차','남/여','분과'],
    [1,'2026001','예시A',1,'남','Primary'],
    [2,'2026002','예시B',2,'여','HBP/Breast']
  ];
  if(typeof XLSX!=='undefined'){
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'명단');
    XLSX.writeFile(wb,'전공의_명단_양식.xlsx');
  } else {
    const csv='\uFEFF'+aoa.map(r=>r.join(',')).join('\r\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='전공의_명단_양식.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }
}

  if(!state.scenarios.length)
    return bar+'<div class="card empty">저장된 시나리오가 없습니다. 자동 배정을 생성한 뒤 저장해 비교해 보세요.</div>';

  const head=state.scenarios.map((s,i)=>
    `<th>${esc(s.name)}<div class="sub">${s.at}</div>
     <div class="btns"><button data-act="loadScen" data-i="${i}">불러오기</button>
     <button class="danger" data-act="delScen" data-i="${i}">삭제</button></div></th>`).join('');
  const body=state.residents.map(r=>
    `<tr><td>${esc(r.name)}<div class="sub">${r.pgy}년차</div></td>`+
    state.scenarios.map(s=>{const o=s.stats[r.id];
      return `<td>${o?`${o.wkH.toFixed(1)}h / ${o.wkN.toFixed(2)}회`:'-'}</td>`;}).join('')+`</tr>`).join('');
  const gap=state.scenarios.map(s=>{
    const hs=Object.values(s.stats).map(o=>o.wkH);
    return `<td><b>${(Math.max(...hs)-Math.min(...hs)).toFixed(1)}h</b></td>`;}).join('');

  return bar+`
    <div class="card">
      <div class="sub" style="margin-bottom:8px">각 칸: 4주 평균 근무(h/주) / 4주 평균 야간 당직(회/주)</div>
      <table>
        <thead><tr><th>전공의</th>${head}</tr></thead>
        <tbody>${body}
          <tr><td><b>근무시간 편차</b></td>${gap}</tr>
        </tbody>
      </table>
    </div>`;
}

/* 전공의별 4주 기간 정규·당직·휴게 집계 (분 단위) */
function workBreakdown(){
  const R=monthRange();
  const C=calcShift(state.work.regular);
  const out={};
  state.residents.forEach(r=>out[r.id]={name:r.name,pgy:r.pgy,reg:0,regDays:0,regBrk:0,wk:0,wkDays:0,we:0,weDays:0,dutyBrk:0});
  for(let d=new Date(R.blockStart);d<=R.blockEnd;d=addD(d,1)){
    const w=isWHD(d);
    state.residents.forEach(r=>{
      const o=out[r.id];
      const x=dayWorkFor(r.id,d);
      if(x.reg>0){
        o.reg+=x.reg; o.regDays++; o.regBrk+=C.breakMin;
      }
      slotsOf(d).forEach(n=>{
        if(state.assign[slotKey(d,n)]!==r.id) return;
        const c=slotShift(d,n);
        if(w){o.we+=c.net; o.weDays++; o.dutyBrk+=c.breakMin;}
        else {o.wk+=c.net; o.wkDays++; o.dutyBrk+=c.breakMin;}
      });
    });
  }
  Object.values(out).forEach(o=>{
    o.total=o.reg+o.wk+o.we;
    o.totalBrk=o.regBrk+o.dutyBrk;
    o.weekly=Math.round(o.total/4);
  });
  return out;
}

function workBreakdownOld(){
  const R=monthRange();
  const C={regular:calcShift(state.work.regular),weekday:calcShift(state.work.weekday)};
  const out={};
  state.residents.forEach(r=>out[r.id]={name:r.name,pgy:r.pgy,reg:0,regDays:0,regBrk:0,wk:0,wkDays:0,we:0,weDays:0,dutyBrk:0});
  for(let d=new Date(R.blockStart);d<=R.blockEnd;d=addD(d,1)){
    const id=state.assign[dkey(d)];
    const w=isWHD(d);
    // 정규 근무: 평일 중 당직이 없는 날
    if(!w){
      state.residents.forEach(r=>{
        if(r.id!==id && state.assign[dkey(addD(d,-1))]!==r.id){
          const o=out[r.id];
          o.reg+=C.regular.net; o.regDays++; o.regBrk+=C.regular.breakMin;
        }
      });
    }
    // 당직 근무
    if(id && out[id]){
      const o=out[id];
      if(w){const c=dutyShift(d); o.we+=c.net; o.weDays++; o.dutyBrk+=c.breakMin;}
      else {o.wk+=C.weekday.net; o.wkDays++; o.dutyBrk+=C.weekday.breakMin;}
    }
  }
  Object.values(out).forEach(o=>{
    o.total=o.reg+o.wk+o.we;
    o.totalBrk=o.regBrk+o.dutyBrk;
    o.weekly=Math.round(o.total/4);
  });
  return out;
}

/* ---------- CSV 내보내기 ---------- */
function exportCSV(){
  const R=monthRange();
  const rows=[['날짜','요일','분과','구분','담당','근무시간(h)']];
  for(let d=new Date(R.viewStart);d<=R.viewEnd;d=addD(d,1)){
    const id=state.assign[dkey(d)];
    const r=state.residents.find(x=>x.id===id);
    slotsOf(d).forEach(n=>{
      const sid=state.assign[slotKey(d,n)];
      const sr=state.residents.find(x=>x.id===sid);
      rows.push([dkey(d),DAYS[d.getDay()],(lineOf(d,n)||{}).dept||'',slotType(d,n),sr?sr.name:'미배정',slotShift(d,n).net/60]);
    });
  }
  rows.push([]);
  rows.push(['4주 기간',`${fmtFull(R.blockStart)} ~ ${fmtFull(R.blockEnd)}`]);
  rows.push(['이름','연차','이번달 당직(h)','4주 당직합계(h)','4주 평균 근무(h/주)','4주 야간합계(회)','4주 평균 야간(회/주)','주말·공휴 당직(회)']);
  Object.values(statsFor(state.assign)).forEach(o=>
    rows.push([o.name,o.pgy+'년차',o.monthH,o.blockH,o.wkH.toFixed(1),o.night,o.wkN.toFixed(2),o.whd]));
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`당직표_${state.y}-${pad(state.m+1)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ---------- 이벤트 ---------- */
const app=document.getElementById('app');
document.getElementById('monthNav').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='prev'){state.m--; if(state.m<0){state.m=11;state.y--;}}
  if(el.dataset.act==='next'){state.m++; if(state.m>11){state.m=0;state.y++;}}
  render();
});

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  switch(a){
    case 'tab': state.tab=el.dataset.tab; break;
    case 'gen':
      if(!confirm('수동으로 수정한 배정이 덮어써집니다. 계속할까요?')) return;
      autoAssign(); break;
    case 'csv': exportCSV(); return;
    case 'print': window.print(); return;
    case 'addRes': {
      const n=document.getElementById('rName').value.trim();
      if(!n){alert('이름을 입력해 주세요.');return;}
      state.residents.push({id:state.nextId++,name:n,pgy:Number(document.getElementById('rPgy').value)});
      break;
    }
    case 'editRes': state.editId=Number(el.dataset.id); break;
    case 'cancelEdit': state.editId=null; break;
    case 'saveRes': {
      const id=Number(el.dataset.id);
      const n=document.getElementById('eName').value.trim();
      if(!n){alert('이름을 입력해 주세요.');return;}
      const r=state.residents.find(x=>x.id===id);
      if(r){
        r.name=n;
        r.pgy=Number(document.getElementById('ePgy').value);
      }
      state.editId=null;
      break;
    }
    case 'downloadTemplate': downloadTemplate(); break;
    case 'cancelUpload': state.upload=null; break;
    case 'applyUpload': {
      const rows=(state.upload&&state.upload.rows)||[];
      const valid=rows.filter(r=>!r.err);
      if(!valid.length){alert('적용할 정상 행이 없습니다.');return;}
      const mode=document.getElementById('uMode').value;
      const add=valid.map(r=>({id:state.nextId++,name:r.name,pgy:r.pgy,empNo:r.emp,sex:r.sex,seq:r.seq,dept:r.dept||''}));
      if(mode==='replace'){
        state.residents=add;
        state.assign={};
      } else {
        const exists=new Set(state.residents.map(r=>r.empNo).filter(Boolean));
        state.residents=state.residents.concat(add.filter(r=>!(r.empNo && exists.has(r.empNo))));
      }
      state.upload=null;
      break;
    }
    case 'dutyTemplate': downloadDutyTemplate(); break;
    case 'saveDept': {
      state.departments=document.getElementById('sDept').value.split(',').map(s=>s.trim()).filter(Boolean);
      break;
    }
    case 'deptCsv': exportDeptCSV(); return;
    case 'saveDuty': {
      const now=new Date();
      const at=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
      state.scenarios.push({
        name:`${state.y}.${pad(state.m+1)} 당직표 ${at}`,
        at,
        assign:{...state.assign},
        dayKind:{...state.dayKind},
        stats:statsFor(state.assign)
      });
      state.dutyMsg={info:`현재 당직표를 저장했습니다 (${at}). 시나리오 비교 탭에서 다시 확인할 수 있고, CSV 내보내기로 파일로 받을 수 있습니다.`,errors:[]};
      break;
    }
    case 'delRes': {
      const id=Number(el.dataset.id);
      if(!confirm('삭제할까요? 해당 전공의의 배정은 모두 미배정으로 바뀝니다.')) return;
      state.residents=state.residents.filter(r=>r.id!==id);
      Object.keys(state.assign).forEach(k=>{if(state.assign[k]===id) state.assign[k]=null;});
      break;
    }
    case 'applySet': {
      state.settings.maxWeekly=Number(document.getElementById('sMax').value)||80;
      state.settings.noConsec=document.getElementById('sNoConsec').checked;
      state.settings.minRest=Math.max(0,Number(document.getElementById('sMinRest').value)||0);
      state.settings.maxCont=Number(document.getElementById('sMaxCont').value)||24;
      state.holidays=new Set(
        document.getElementById('sHol').value.split(',').map(s=>s.trim()).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s)));
      break;
    }
    case 'saveScen': {
      const name=document.getElementById('scName').value.trim()||`배정안 ${state.scenarios.length+1}`;
      const now=new Date();
      state.scenarios.push({
        name,
        at:`${pad(now.getHours())}:${pad(now.getMinutes())}`,
        assign:{...state.assign},
        dayKind:{...state.dayKind},
        stats:statsFor(state.assign)
      });
      break;
    }
    case 'loadScen': {
      state.assign={...state.scenarios[+el.dataset.i].assign};
      state.dayKind={...(state.scenarios[+el.dataset.i].dayKind||{})};
      state.tab='calendar';
      break;
    }
    case 'delScen': state.scenarios.splice(+el.dataset.i,1); break;
    case 'saveWork': {
      ['regular','weekday','weekendDay','weekendNight','weekendAll'].forEach(k=>{
        state.work[k]={
          start:document.getElementById(`wk_${k}_start`).value||state.work[k].start,
          end:document.getElementById(`wk_${k}_end`).value||state.work[k].end,
          breakMin:Math.max(0,Number(document.getElementById(`wk_${k}_break`).value)||0)
        };
      });
      break;
    }
    case 'resetWork': state.work=JSON.parse(JSON.stringify(DEFAULT_WORK)); break;
  }
  render();
});

app.addEventListener('change',e=>{
  const s=e.target;
  if(s.id==='uploadFile'){ handleUpload(s.files&&s.files[0]); return; }
  if(s.id==='dashSel'){ state.dashId=Number(s.value); render(); return; }
  if(s.id==='dutyFile'){ handleDutyUpload(s.files&&s.files[0]); return; }
  if(s.dataset && s.dataset.kind){
    state.dayKind[s.dataset.kind]=s.value;
    if(s.value==='all'){ state.assign[s.dataset.kind.replace(/\|day$/,'|night')]=null; }
    render();
    return;
  }
  if(s.dataset && s.dataset.k){
    state.assign[s.dataset.k]=s.value?Number(s.value):null;
    render();
  }
});

autoAssign();
render();
